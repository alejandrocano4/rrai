name: Actualizar RRAI diariamente

on:
  schedule:
    - cron: '0 22 * * 1-5'
  workflow_dispatch:

jobs:
  calcular:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install yfinance pandas numpy

      - name: Calcular RRAI
        run: python calcular_rrai.py

      - name: Publicar datos
        run: |
          git config --local user.email "rrai@chcapital.es"
          git config --local user.name "RRAI Bot"
          git add docs/data/rrai_historico.json
          git diff --staged --quiet || git commit -m "RRAI actualizado $(date '+%Y-%m-%d')"
          git push
