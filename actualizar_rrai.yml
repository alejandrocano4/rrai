name: Actualizar RRAI diariamente

on:
  schedule:
    # Ejecutar cada día a las 22:00 UTC (cuando todos los mercados han cerrado)
    - cron: '0 22 * * 1-5'
  workflow_dispatch:
    # Permite ejecutar manualmente desde GitHub si es necesario

jobs:
  calcular:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          pip install yfinance pandas numpy

      - name: Calcular RRAI
        run: |
          python calcular_rrai.py

      - name: Publicar datos actualizados
        run: |
          git config --local user.email "rrai@chcapital.es"
          git config --local user.name "RRAI Bot"
          git add docs/data/rrai_historico.json
          git diff --staged --quiet || git commit -m "RRAI actualizado $(date '+%Y-%m-%d')"
          git push
